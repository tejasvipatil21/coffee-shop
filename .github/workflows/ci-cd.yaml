name: Coffee App CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend
      - name: Build Backend Image
        run: |
          docker build -t tejasvipatil2001/backend:latest ./backend

      - name: Push Backend Image
        run: |
          docker push tejasvipatil2001/backend:latest

      # Frontend
      - name: Build Frontend Image
        run: |
          docker build -t tejasvipatil2001/frontend:latest ./frontend

      - name: Push Frontend Image
        run: |
          docker push tejasvipatil2001/frontend:latest
