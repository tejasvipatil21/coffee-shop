version: "3.9"

services:
  db:
    image: postgres:15
    container_name: coffee-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: coffee_shop
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: coffee-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: coffee-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend