apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: coffee-app
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS coffees (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100),
        price NUMERIC
    );

    INSERT INTO coffees (name, price) VALUES
    ('Espresso', 120),
    ('Cappuccino', 150);